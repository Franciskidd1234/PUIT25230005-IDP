<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Detection - Me or Not</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafbff;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        .upload-area input {
            display: none;
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .upload-text {
            color: #667eea;
            font-weight: 500;
        }
        .upload-hint {
            color: #999;
            font-size: 12px;
            margin-top: 8px;
        }
        .preview-container {
            display: none;
            margin-top: 20px;
        }
        .preview-container.show {
            display: block;
        }
        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .result-container {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            animation: slideIn 0.3s ease;
        }
        .result-container.show {
            display: block;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
        }
        .result-error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }
        .result-label {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
        }
        .result-success .result-label {
            color: #155724;
        }
        .result-error .result-label {
            color: #721c24;
        }
        .result-details {
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
        }
        .result-success .result-details {
            color: #155724;
        }
        .result-error .result-details {
            color: #721c24;
        }
        .confidence-bar {
            background: #e9ecef;
            border-radius: 10px;
            height: 8px;
            margin-top: 15px;
            overflow: hidden;
        }
        .confidence-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        .confidence-success .confidence-fill {
            background: linear-gradient(90deg, #28a745, #20c997);
        }
        .confidence-error .confidence-fill {
            background: linear-gradient(90deg, #dc3545, #fd7e14);
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Image Detection</h1>
        <p class="subtitle">Upload an image to detect if it's you</p>
        
        <div class="upload-area" id="uploadArea">
            <input type="file" id="imageInput" accept="image/*">
            <div class="upload-icon">📷</div>
            <p class="upload-text">Click or drag & drop an image</p>
            <p class="upload-hint">Supports: PNG, JPG, JPEG, GIF, WebP (Max 16MB)</p>
        </div>
        
        <div class="preview-container" id="previewContainer">
            <img id="previewImage" class="preview-image" alt="Preview">
        </div>
        
        <button class="btn btn-primary" id="detectBtn" disabled>
            Detect
        </button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing image...</p>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        
        <div class="result-container" id="resultContainer">
            <div class="result-label" id="resultLabel"></div>
            <div class="result-details" id="resultDetails"></div>
            <div class="confidence-bar" id="confidenceBar">
                <div class="confidence-fill" id="confidenceFill" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const detectBtn = document.getElementById('detectBtn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const resultContainer = document.getElementById('resultContainer');
        const resultLabel = document.getElementById('resultLabel');
        const resultDetails = document.getElementById('resultDetails');
        const confidenceBar = document.getElementById('confidenceBar');
        const confidenceFill = document.getElementById('confidenceFill');

        let selectedFile = null;

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => uploadArea.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => uploadArea.classList.remove('dragover'), false);
        });

        uploadArea.addEventListener('drop', handleDrop, false);
        uploadArea.addEventListener('click', () => imageInput.click());
        imageInput.addEventListener('change', handleFileSelect);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        function handleFileSelect(e) {
            handleFiles(e.target.files);
        }

        function handleFiles(files) {
            if (files.length === 0) return;
            
            const file = files[0];
            if (!file.type.startsWith('image/')) {
                showError('Please select an image file');
                return;
            }
            
            if (file.size > 16 * 1024 * 1024) {
                showError('File size must be less than 16MB');
                return;
            }
            
            selectedFile = file;
            showPreview(file);
            detectBtn.disabled = false;
            hideError();
            hideResult();
        }

        function showPreview(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.classList.add('show');
            };
            reader.readAsDataURL(file);
        }

        detectBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            detectBtn.disabled = true;
            loading.classList.add('show');
            hideError();
            hideResult();
            
            const formData = new FormData();
            formData.append('image', selectedFile);
            
            try {
                const response = await fetch('/detect', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                loading.classList.remove('show');
                
                if (data.success) {
                    showResult(data.result);
                } else {
                    showError(data.error || 'Detection failed');
                    detectBtn.disabled = false;
                }
            } catch (err) {
                loading.classList.remove('show');
                showError('Network error. Please try again.');
                detectBtn.disabled = false;
            }
        });

        function showResult(result) {
            const isMe = result.is_me || result.class === 'me' || (result.predictions && result.predictions[0]?.class === 'me');
            const confidence = result.confidence || result.predictions?.[0]?.confidence || 0;
            const className = result.class || result.predictions?.[0]?.class || 'unknown';
            
            resultContainer.className = 'result-container show ' + (isMe ? 'result-success' : 'result-error');
            confidenceBar.className = 'confidence-bar ' + (isMe ? 'confidence-success' : 'confidence-error');
            
            resultLabel.textContent = isMe ? '✅ This is YOU!' : '❌ This is NOT you';
            resultDetails.innerHTML = `
                <strong>Detected:</strong> ${className}<br>
                <strong>Confidence:</strong> ${(confidence * 100).toFixed(1)}%
            `;
            confidenceFill.style.width = `${confidence * 100}%`;
            
            resultContainer.classList.add('show');
            detectBtn.disabled = false;
        }

        function hideResult() {
            resultContainer.classList.remove('show');
            confidenceFill.style.width = '0%';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }
    </script>
</body>
</html>
